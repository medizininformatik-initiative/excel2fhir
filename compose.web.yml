name: excel2fhir-web-prototype
services:
  api:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    volumes:
      - workbench:/data
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    command: [python, worker.py]
    init: true
    volumes:
      - workbench:/data
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 15s
    restart: unless-stopped
  web:
    build: web/frontend
    ports:
      - '127.0.0.1:5184:8080'
    depends_on:
      - api
    mem_limit: 128m
    cpus: 1
    restart: unless-stopped
volumes:
  workbench:
