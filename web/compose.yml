name: excel2fhir-web-prototype
services:
  api:
    build:
      context: ..
      dockerfile: web/backend/Dockerfile
      target: api
    volumes:
      - workbench:/data
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped
  worker:
    build:
      context: ..
      dockerfile: web/backend/Dockerfile
      target: worker
    command: [python, worker.py]
    init: true
    volumes:
      - workbench:/data
    mem_limit: 4g
    cpus: 2
    stop_grace_period: 15s
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: web/frontend/Dockerfile
    ports:
      - '127.0.0.1:5184:8080'
    depends_on:
      - api
    mem_limit: 128m
    cpus: 1
    restart: unless-stopped
volumes:
  workbench:
