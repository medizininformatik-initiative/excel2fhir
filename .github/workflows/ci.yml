name: CI

on:
  push:
    branches:
    - main
    - release
    - develop
    tags:
    - v[0-9]+.[0-9]+**
  pull_request:
    branches:
    - main
    - release
    - develop

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test Synthea import and roundtrip checks
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Cache Local Maven Repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-repo

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: Build
        run: mvn -B package

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  security-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: docker/Dockerfile
        tags: security-scan-build:latest
        push: false

    - name: Run Trivy Vulnerability Scanner and Save to Sarif File
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: security-scan-build:latest
        format: sarif
        output: trivy-results.sarif
        severity: 'CRITICAL,HIGH'
        timeout: '15m0s'

    - name: Upload Trivy Scan Results to GitHub Security Tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results.sarif

    - name: Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: security-scan-build:latest
        exit-code: 1
        ignore-unfixed: true
        trivyignores: '.trivyignore'
        severity: 'CRITICAL,HIGH'
        timeout: '15m0s'

  synthea-workflow:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build existing Synthea importer image
      run: docker build -f docker/synthea.Dockerfile -t excel2fhir-synthea:ci .
    - name: Convert and validate actual Synthea regression fixtures
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/synthea-results"
        set +e
        docker run --rm \
          -v "$PWD/scripts/tests/fixtures/synthea:/input:ro" \
          -v "$RUNNER_TEMP/synthea-results:/output" \
          excel2fhir-synthea:ci -v -i /input -o /output
        result=$?
        set -e
        python3 - "$RUNNER_TEMP/synthea-results" "$result" <<'PYTHON'
        import json, pathlib, sys
        directory = next(pathlib.Path(sys.argv[1]).glob("run-*"))
        report = json.loads((directory / "details/reports/summary.json").read_text())
        assert not report['failures'], report
        assert len(report['results']) == 2, report
        assert report['status'] in ('COMPLETE', 'NOT_CHECKED'), report
        assert int(sys.argv[2]) == (0 if report['status'] == 'COMPLETE' else 1), report
        assert all(r['importStatus'] == 'COMPLETE' for r in report['results']), report
        bundles = [json.loads(p.read_text()) for p in sorted((directory / 'fhir').glob('*.json'))]
        lines = [json.loads(line) for line in (directory / 'fhir/patients.ndjson').read_text().splitlines()]
        assert bundles == lines, 'JSON and NDJSON differ'
        assert not list((directory / 'details').glob('cases/*/run-*/fhir/*.json')), 'Duplicate final bundles'
        PYTHON
    - name: Scan Synthea importer image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: excel2fhir-synthea:ci
        exit-code: 1
        ignore-unfixed: true
        trivyignores: '.trivyignore'
        severity: 'CRITICAL,HIGH'
        timeout: '15m0s'
    - name: Build generator and run the complete workflow offline
      shell: bash
      run: |
        docker compose -p excel2fhir-ci -f compose.synthea.yml build
        docker run --rm --network none --entrypoint python3 excel2fhir-ci-synthea:latest \
          -m unittest discover -s /app/scripts/tests -p test_container_output.py -v
        set +e
        docker compose -p excel2fhir-ci -f compose.synthea.yml run --rm synthea
        result=$?
        set -e
        python3 - "$result" <<'PYTHON'
        import json, pathlib, sys
        runs = list(pathlib.Path('outputGlobal').glob('run-*'))
        assert len(runs) == 1, runs
        report = json.loads((runs[0] / 'details/reports/workflow.json').read_text())
        summary = json.loads((runs[0] / 'details/reports/summary.json').read_text())
        assert report['status'] == 'NOT_VALIDATED', report
        assert report['validationEnabled'] is False, report
        assert int(sys.argv[1]) == 0, report
        assert all(r['validationStatus'] == 'NOT_VALIDATED' for r in summary['results']), summary
        assert not list(runs[0].rglob('*.validation.json')), 'Unexpected validation reports'
        assert summary['results'] and not summary['failures'], summary
        bundles = [json.loads(p.read_text()) for p in sorted((runs[0] / 'fhir').glob('*.json'))]
        lines = [json.loads(line) for line in (runs[0] / 'fhir/patients.ndjson').read_text().splitlines()]
        assert len(bundles) == len(summary['results'])
        assert bundles == lines, 'JSON and NDJSON differ'
        PYTHON
    - name: Scan complete workflow image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: excel2fhir-ci-synthea:latest
        exit-code: 1
        ignore-unfixed: true
        trivyignores: '.trivyignore'
        severity: 'CRITICAL,HIGH'
        timeout: '15m0s'
    - name: Preserve regression reports and generated workbooks
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: synthea-workflow-results
        path: |
          ${{ runner.temp }}/synthea-results
          outputGlobal/

  build-excel2fhir:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [test, security-scan, synthea-workflow]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Login to GitHub Docker Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Prepare Version
      id: prep
      run: |
        echo "repository=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
        echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

    - name: Build and push docker image for excel2fhir
      uses: docker/build-push-action@v4
      with:
        context: .
        file: docker/Dockerfile
        tags: |
          ghcr.io/${{ steps.prep.outputs.repository }}/excel2fhir:latest
          ghcr.io/${{ steps.prep.outputs.repository }}/excel2fhir:${{ steps.prep.outputs.version }}
        push: true
